[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwvllm"
version = "0.1.0"
description = "A lightweight paged-attention inference engine"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "triton", "numpy", "xxhash", "tqdm", "safetensors"]

[tool.setuptools.packages.find]
include = ["wwvllm*"]
